<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Peak Gremlin</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --mute: #666666;
      --sub: #e60000;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      overflow-x: hidden;
      overflow-y: hidden;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.is-live {
      overflow-x: hidden;
      overflow-y: hidden;
      cursor: none;
    }

    body.is-paused {
      cursor: none;
    }

    .pause-hint {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(13px, 2.2vw, 16px);
      letter-spacing: 0.08em;
      text-transform: lowercase;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    body.is-paused .pause-hint {
      opacity: 1;
    }

    /* ——— opening: footage bg + still (no type) ——— */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vw, 48px);
      background: transparent;
      cursor: none;
      overflow: hidden;
    }

    .intro,
    .intro * {
      cursor: none;
    }

    .intro.is-gone {
      pointer-events: none;
      display: none;
    }

    /* intro: gremlinchaos wordmark pointer — red on the still, turquoise outside */
    .grem-cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 60;
      width: min(31.45vw, 292px); /* 15% smaller than 37vw / 344px */
      aspect-ratio: 1517 / 101;
      background: #5afff0;
      -webkit-mask: url("./005_DESIGN_ASSETS/logo.svg") center / contain no-repeat;
      mask: url("./005_DESIGN_ASSETS/logo.svg") center / contain no-repeat;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55))
              drop-shadow(0 0 1px rgba(0, 0, 0, 0.35));
      pointer-events: none;
      transform: translate(-50%, -50%);
      will-change: transform, background-color, width, filter;
      opacity: 0;
      transition: background-color 80ms linear, opacity 120ms ease, width 180ms ease;
    }

    .grem-cursor.is-on {
      opacity: 1;
    }

    .grem-cursor.is-over-face {
      background: #e60000;
    }

    /* live + pause gremlin cursor only — 15% bigger, slight black outline */
    .grem-cursor.is-live {
      width: 63px; /* +15% from 55 */
      aspect-ratio: 682 / 306;
      background: #5afff0;
      -webkit-mask: url("./005_DESIGN_ASSETS/Gremlin.svg") center / contain no-repeat;
      mask: url("./005_DESIGN_ASSETS/Gremlin.svg") center / contain no-repeat;
      filter: drop-shadow(0 0 0.55px #000)
              drop-shadow(0 0 0.55px #000)
              drop-shadow(0 0 1px rgba(0, 0, 0, 0.85))
              drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
    }

    .intro-frame {
      position: relative;
      width: min(42vh, 420px);
      max-width: min(88vw, 420px);
    }

    .intro-still {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #111;
    }

    .intro-still img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: top;
      user-select: none;
      -webkit-user-drag: none;
    }

    .intro-hint {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    /* page is playlist-driven — no horizontal scroll chrome */
    .scroll-track {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #111;
    }

    /* hide trail/meetings until intro ends — keep bg video visible underneath */
    body:not(.is-live) #map,
    body:not(.is-live) #meetings {
      opacity: 0;
      pointer-events: none;
    }

    body:not(.is-live) .bg-video {
      opacity: 1;
      filter: saturate(1.05) contrast(1.05) brightness(0.92);
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: saturate(1.05) contrast(1.05);
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 3;
      background: transparent;
      pointer-events: none;
    }

    /* must sit above #map or the WebGL canvas covers every shot */
    #meetings {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    /* BPM / elev always above metal + media; frame synced to asset bounds in JS */
    #shotHud {
      position: absolute;
      inset: 0;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #shotHud.on { opacity: 1; }
    #shotHud .meeting-frame {
      position: absolute;
      width: auto;
      max-height: none;
      margin: 0;
    }
    #shotHud .sub {
      bottom: 0.55rem;
    }

    .finale-label {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;
      margin: 0;
      padding: 0 0.5rem;
      color: var(--sub);
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.25;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(0, 0, 0, 0.85),
        0 0 2px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 0.45rem);
      transition: opacity 0.35s ease;
    }
    .finale-label.on { opacity: 1; }
    .finale-line {
      display: block;
      opacity: 0;
      white-space: nowrap;
      text-transform: uppercase;
      transition: opacity 0.18s ease;
    }
    .finale-line.on { opacity: 1; }
    .finale-line.is-ital {
      font-style: italic;
      text-transform: none;
      letter-spacing: 0.06em;
      font-size: 0.95em;
      color: #5afff0;
    }

    .status {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 5;
      color: var(--mute);
      font-size: 12px;
    }
    .status.error { color: #b00000; }

    .meeting {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vw, 48px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, background-color 0.8s ease;
      background: rgba(255, 255, 255, 0);
    }

    .meeting.on {
      opacity: 1;
      background: rgba(8, 10, 14, 0.12);
    }

    .meeting-frame {
      position: relative;
      width: min(782px, 100%);
      max-height: min(66vh, 697px);
    }

    .meeting video {
      display: block;
      width: 100%;
      max-height: min(60vh, 612px);
      object-fit: cover;
      background: #eee;
    }

    .meeting img {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(60vh, 612px);
      object-fit: contain;
      background: transparent;
    }

    /* per-meeting sub sits under metal; live copy is #shotHud */
    .meeting .sub { visibility: hidden; }

    /* old-school film subtitles — pinned to bottom of the overlay asset */
    .sub {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.55rem;
      margin: 0;
      padding: 0 1rem;
      text-align: center;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(15px, 2.4vw, 24px);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1.25;
      color: var(--sub);
      text-transform: uppercase;
      text-shadow:
        0 1px 0 rgba(0, 0, 0, 0.85),
        0 0 2px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

  </style>
</head>
<body>
  <p class="status" id="status">Loading…</p>

  <section class="intro" id="intro" aria-label="Peak Gremlin">
    <div class="intro-frame">
      <div class="intro-still">
        <img
          src="./001_STILLS/peakgremlin_still_20261002_124838.jpg"
          alt="Peak Gremlin"
          width="1080"
          height="1350"
        />
      </div>
    </div>
    <p class="intro-hint">click</p>
  </section>
  <div class="grem-cursor" id="gremCursor" aria-hidden="true"></div>

  <div class="scroll-track" id="scrollTrack">
    <div class="stage">
      <video
        id="bgVideo"
        class="bg-video"
        muted
        loop
        playsinline
        autoplay
        preload="auto"
        src="./002_MOVING_IMAGE/peakgremlin_movingimage_20261002_152601.mp4"
      ></video>
      <div id="meetings"></div>
      <canvas id="map"></canvas>
      <div id="shotHud" aria-hidden="true">
        <div class="meeting-frame">
          <p class="sub" id="shotSub"></p>
        </div>
      </div>
      <div class="finale-label" id="finaleLabel" aria-hidden="true">
        <span class="finale-line" id="finaleLine1">lagazuoi</span>
        <span class="finale-line is-ital" id="finaleLine2">with love x</span>
      </div>
      <audio
        id="climbAudio"
        preload="auto"
        src="./006_MUSIC/Miley%20Cyrus%20-%20The%20Climb.mp3"
      ></audio>
    </div>
  </div>
  <p class="pause-hint" id="pauseHint" hidden>paused · click to play</p>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const statusEl = document.getElementById("status");
    const meetingsEl = document.getElementById("meetings");
    const shotHud = document.getElementById("shotHud");
    const shotSub = document.getElementById("shotSub");
    const shotHudFrame = shotHud?.querySelector(".meeting-frame") || null;
    const finaleLabel = document.getElementById("finaleLabel");
    const finaleLine1 = document.getElementById("finaleLine1");
    const finaleLine2 = document.getElementById("finaleLine2");
    const canvas = document.getElementById("map");
    const stageEl = canvas?.parentElement || null;
    const introEl = document.getElementById("intro");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    let path = [];
    let assets = [];
    let meetings = [];
    // timed shot playlist: full clip → 2s cut gap → next
    // Pour progress is driven by this playlist so the metal always finishes with the last shot.
    // along-trail order — trail: "front" = metal over media, "behind" = metal under media
    const SHOT_PLAYLIST = [
      { file: "peakgremlin_movingimage_20261002_141235.mp4", trail: "behind" },
      { file: "peakgremlin_still_20261002_122245.jpg", trail: "front" },
      { file: "peakgremlin_still_20261002_123549.jpg", trail: "behind" },
      { file: "peakgremlin_movingimage_20261002_144947.mp4", trail: "front" },
      { file: "peakgremlin_movingimage_20261002_145719.mp4", trail: "behind" },
      // lock song speed after this clip (end push) through finale
      { file: "peakgremlin_movingimage_20261002_152833.mp4", trail: "front", lockTempoAfter: true },
      { file: "peakgremlin_movingimage_20261002_154248.mp4", trail: "behind" },
      { file: "peakgremlin_movingimage_20261002_163517.mp4", trail: "front", subEnd: true },
    ];
    const SHOT_FILES = SHOT_PLAYLIST.map((s) => s.file);
    const SHOT_GAP_MS = 2000; // fallback if music not playing
    const SHOT_GAP_BEATS = 2; // black gap ≈ 2 beats (~1.5s at 78bpm)
    // extra black before 163517 so the last clip lands a beat later (−50ms tweak)
    const SHOT_LAST_EXTRA_GAP_MS = 1950;
    const SHOT_FALLBACK_DUR = 12; // seconds if metadata not ready
    const SHOT_STILL_DUR = 6; // stills sit ~6s then beat-cut like clips
    const SHOT_FADE_MS = 800; // match .meeting / #shotHud fade transition
    // The Climb beat grid (file timeline) — overlay cuts snap here when possible
    const CLIMB_BPM = 78.4;
    const CLIMB_BEAT0 = 1.545; // trimmed file (was 2.383 before cutting ~0.84s lead-in)
    const CLIMB_BEAT = 60 / CLIMB_BPM;
    let shotIndex = -1;
    let shotTimer = 0;
    let shotPhase = "idle"; // idle | waitFirst | playing | fadingOut | gap | done
    let shotFadeThen = null; // "gap" | "finale" after fade-out
    // The Climb — starts with GREM PEAK write; BPM nudges from first overlay
    const climbAudio = document.getElementById("climbAudio");
    const CLIMB_START_DELAY = 0.2; // seconds after click-in before audio plays
    // fallback if gap length unknown — real ease spans the empty black before last shot
    const CLIMB_NORMAL_EASE_S = 2.4;
    // trimmed file: hold ~11s past the first verse+chorus cut, then fade
    const CLIMB_CUT_AT = 85.05;
    const CLIMB_OUTRO_FADE_S = 1.8;
    const MODE_BPM = 140; // normal song speed/pitch baseline
    let climbTempoLive = false;
    let climbTempoLocked = false; // freeze rate after late still through penultimate
    let climbLockedRate = 1;
    let climbRate = 1;
    let climbStarted = false;
    let climbOutro = false;
    let climbEaseActive = false; // wall-clock ease to 1× in the empty gap
    let climbEaseFrom = 1;
    let climbEaseT = 0; // 0→1 over climbEaseDur
    let climbEaseDur = CLIMB_NORMAL_EASE_S;
    let hrViz = 0.5; // smoothed 0..1 — low BPM → 0 (far/small), high → 1 (close/big)
    let progress = 0;
    let target = 0;
    let speedN = 0;
    let isLive = false;
    let experiencePaused = false;
    let pauseClimbWasPlaying = false;
    let pauseBgWasPlaying = false;
    let pauseArmedAt = 0; // ignore the enter-click that starts the experience
    // intro (still only) → text (metal writes PEAK GREM) → hike (GPX)
    let phase = "intro";
    let textProgress = 0;
    let textCurve = null;
    let hikeCurve = null;
    let textMesh = null;
    let hikeMesh = null;
    let textTubular = 400;
    let hikeTubular = 600;
    let beginHikeAt = 0;
    let hikeSideSign = 1;
    let hikeAutoPour = false;
    let textExit = 0; // 0→1: PEAK GREM slides off left after trail takes over
    let finale = false;
    let finaleT = 0;
    let finaleCaptionStep = 0; // 0 map → 1 lagazuoi → 2 with love x
    let finaleCaptionTimer = 0;
    const trailCenter = new THREE.Vector3();
    const trailPeak = new THREE.Vector3(); // highest point on the poured route
    let trailSpan = 80;
    let trailSpanXZ = 80;

    // Tiny turquoise gremlin cursor — red over the intro still, stays for the live page
    (function setupIntro() {
      if (!introEl) return;
      let exiting = false;
      const cursorEl = document.getElementById("gremCursor");
      const faceEl = introEl.querySelector(".intro-still");
      let overFace = false;

      const moveCursor = (clientX, clientY) => {
        if (!cursorEl) return;
        cursorEl.style.transform = `translate(${clientX}px, ${clientY}px) translate(-50%, -50%)`;
        cursorEl.classList.add("is-on");
        if (!exiting && faceEl) {
          const r = faceEl.getBoundingClientRect();
          overFace =
            clientX >= r.left &&
            clientX <= r.right &&
            clientY >= r.top &&
            clientY <= r.bottom;
          cursorEl.classList.toggle("is-over-face", overFace);
        }
      };

      const enterExperience = () => {
        if (exiting) return;
        exiting = true;
        introEl.classList.add("is-gone");
        introEl.remove();
        document.body.classList.add("is-live");
        isLive = true;
        pauseArmedAt = performance.now() + 500;
        if (cursorEl) {
          cursorEl.classList.remove("is-over-face");
          cursorEl.classList.add("is-live"); // swap logo → tiny turquoise gremlin
        }
        startTextPhase();
        bgVideo?.play?.().catch(() => {});
      };

      // track on the window so the gremlin stays after intro is removed
      addEventListener("pointermove", (e) => {
        moveCursor(e.clientX, e.clientY);
      }, { passive: true });
      addEventListener("touchmove", (e) => {
        const t = e.touches?.[0];
        if (t) moveCursor(t.clientX, t.clientY);
      }, { passive: true });

      introEl.addEventListener("click", (e) => {
        moveCursor(e.clientX, e.clientY);
        // only begin when the gremlin is red (over the still)
        if (!overFace || exiting) return;
        e.stopPropagation();
        enterExperience();
      });

      if (statusEl) statusEl.hidden = true;
      const bootBg = document.getElementById("bgVideo");
      if (bootBg) {
        bootBg.muted = true;
        bootBg.playsInline = true;
        bootBg.play().catch(() => {});
      }
    })();

    const scene = new THREE.Scene();
    // transparent so video shows through and ShadowMaterial trail/drip shadows read clearly
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 20000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.55;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.AmbientLight(0xffffff, 0.22));
    // hard sun — hot specular hits where the trail faces the light
    const sun = new THREE.DirectionalLight(0xfff1d6, 3.2);
    const sunBaseIntensity = 3.2;
    sun.position.set(40, 120, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0002;
    sun.shadow.normalBias = 0.04;
    sun.shadow.radius = 2.5;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 520;
    sun.shadow.camera.left = -110;
    sun.shadow.camera.right = 110;
    sun.shadow.camera.top = 110;
    sun.shadow.camera.bottom = -110;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xb8d0ff, 0.4);
    const fillBaseIntensity = 0.4;
    fill.position.set(-80, 40, 60);
    scene.add(fill);
    const kick = new THREE.DirectionalLight(0xffffff, 1.6);
    const kickBaseIntensity = 1.6;
    kick.position.set(20, 30, 100);
    scene.add(kick);
    // rim glint — helps sunlit stretches; shade stays duller via sunlit attribute
    const glint = new THREE.DirectionalLight(0xfffaf0, 1.5);
    const glintBaseIntensity = 1.5;
    glint.position.set(-30, 90, -40);
    scene.add(glint);
    scene.add(glint.target);

    const bgVideo = document.getElementById("bgVideo");
    let videoTex = null;
    let pmrem = null;
    let envRT = null;
    let bgPlane = null;

    let silverMat = null;
    let groundMat = null;
    let markers = [];
    let curve = null;
    let liquidMesh = null;
    let groundMesh = null;
    let textGround = null;
    let pourTip = null;
    let pourStream = null;
    let tubularSegs = 600;
    let radialSegs = 36;
    let groundY = 0;
    let lastProgress = 0;
    let pourCarry = 0;
    const drips = [];
    const MAX_DRIPS = 56;
    let scaleXZ = 0.08;
    let scaleY = 0.18;
    const camPos = new THREE.Vector3();
    const look = new THREE.Vector3();
    const _tip = new THREE.Vector3();
    const _tmp = new THREE.Vector3();
    let lastT = performance.now();
    let lastEnvRefresh = 0;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function samplePath(p) {
      if (!path.length) return null;
      const max = path.length - 1;
      const f = clamp(p, 0, 1) * max;
      const i = Math.floor(f);
      const j = Math.min(i + 1, max);
      const t = f - i;
      const a = path[i];
      const b = path[j];
      const hrA = a.hr ?? null;
      const hrB = b.hr ?? null;
      let hr = null;
      if (hrA != null && hrB != null) hr = Math.round(lerp(hrA, hrB, t));
      else hr = hrA ?? hrB;
      return {
        x: lerp(a.x, b.x, t),
        y: lerp(a.y, b.y, t),
        z: lerp(a.z, b.z, t),
        ele: lerp(a.ele, b.ele, t),
        speed: lerp(a.speed, b.speed, t),
        spdN: lerp(a.spdN, b.spdN, t),
        eleN: lerp(a.eleN, b.eleN, t),
        dist: lerp(a.dist, b.dist, t),
        hr,
      };
    }

    // Filenames are local time (UTC+2), same as build-manifest.py
    const LOCAL_OFFSET_MS = 2 * 60 * 60 * 1000;

    function fileLocalToUtcMs(file) {
      const m = file.match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
      if (!m) return null;
      const asIfUtc = Date.parse(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`);
      if (Number.isNaN(asIfUtc)) return null;
      return asIfUtc - LOCAL_OFFSET_MS;
    }

    /** Prefer local filename clock; if outside the GPX window, try UTC so media still lands on trail. */
    function fileTimeOnTrailMs(file) {
      const m = file.match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
      if (!m || !path.length) return fileLocalToUtcMs(file);
      const asIfUtc = Date.parse(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`);
      if (Number.isNaN(asIfUtc)) return null;
      const localMs = asIfUtc - LOCAL_OFFSET_MS;
      const t0 = Date.parse(path[0].t);
      const tN = Date.parse(path[path.length - 1].t);
      if (localMs >= t0 && localMs <= tN) return localMs;
      if (asIfUtc >= t0 && asIfUtc <= tN) return asIfUtc;
      // nearest in-window time (keeps early/late stills on the route)
      if (localMs < t0 && asIfUtc < t0) return t0;
      if (localMs > tN && asIfUtc > tN) return tN;
      return Math.abs(localMs - t0) < Math.abs(asIfUtc - t0) ? localMs : asIfUtc;
    }

    function pathProgressForTime(ms) {
      if (!path.length) return 0;
      let best = 0;
      let bestD = Infinity;
      for (let i = 0; i < path.length; i++) {
        const d = Math.abs(Date.parse(path[i].t) - ms);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      }
      return best / Math.max(1, path.length - 1);
    }

    function samplePathAtTime(ms) {
      if (!path.length) return null;
      const t0 = Date.parse(path[0].t);
      const tN = Date.parse(path[path.length - 1].t);
      if (ms <= t0) return samplePath(0);
      if (ms >= tN) return samplePath(1);

      let lo = 0;
      let hi = path.length - 1;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (Date.parse(path[mid].t) <= ms) lo = mid;
        else hi = mid;
      }
      const a = path[lo];
      const b = path[hi];
      const ta = Date.parse(a.t);
      const tb = Date.parse(b.t);
      const u = tb === ta ? 0 : clamp((ms - ta) / (tb - ta), 0, 1);
      const hrA = a.hr ?? null;
      const hrB = b.hr ?? null;
      let hr = null;
      if (hrA != null && hrB != null) hr = Math.round(lerp(hrA, hrB, u));
      else hr = hrA ?? hrB;
      return {
        ele: lerp(a.ele, b.ele, u),
        speed: lerp(a.speed, b.speed, u),
        spdN: lerp(a.spdN, b.spdN, u),
        eleN: lerp(a.eleN, b.eleN, u),
        dist: lerp(a.dist, b.dist, u),
        hr,
        progress: (lo + u) / Math.max(1, path.length - 1),
      };
    }

    function formatSub(ele, hr, { end = false } = {}) {
      const e = Math.round(ele).toLocaleString("en-GB");
      if (end) return `${e} M   ·   END`;
      return hr != null ? `${e} M   ·   ${hr} BPM` : `${e} M`;
    }

    function applyClimbPitchLink() {
      if (!climbAudio) return;
      // while tempo-warped: pitch follows rate; at 1× restore original file pitch
      const warped = climbTempoLive || climbTempoLocked || climbEaseActive;
      try { climbAudio.preservesPitch = !warped; } catch (_) { /* ignore */ }
      try { climbAudio.mozPreservesPitch = !warped; } catch (_) { /* ignore */ }
      try { climbAudio.webkitPreservesPitch = !warped; } catch (_) { /* ignore */ }
    }

    function startClimbAudio() {
      if (!climbAudio || climbStarted) return;
      climbStarted = true;
      climbOutro = false;
      climbEaseActive = false;
      climbEaseFrom = 1;
      climbEaseT = 0;
      climbEaseDur = CLIMB_NORMAL_EASE_S;
      climbRate = 1;
      try { climbAudio.playbackRate = 1; } catch (_) { /* ignore */ }
      applyClimbPitchLink();
      try { climbAudio.volume = 1; } catch (_) { /* ignore */ }
      try { climbAudio.loop = false; } catch (_) { /* ignore */ }
      const play = () => {
        try { climbAudio.currentTime = 0; } catch (_) { /* ignore */ }
        const p = climbAudio.play();
        if (p && p.catch) p.catch(() => {});
      };
      if (climbAudio.readyState >= 1) play();
      else climbAudio.addEventListener("loadedmetadata", play, { once: true });
    }

    function setExperiencePaused(next) {
      if (!isLive || experiencePaused === next) return;
      experiencePaused = next;
      document.body.classList.toggle("is-paused", experiencePaused);
      const hint = document.getElementById("pauseHint");
      if (hint) hint.hidden = !experiencePaused;

      if (experiencePaused) {
        pauseClimbWasPlaying = !!(climbAudio && !climbAudio.paused && climbStarted);
        pauseBgWasPlaying = !!(bgVideo && !bgVideo.paused);
        try { climbAudio?.pause?.(); } catch (_) { /* ignore */ }
        try { bgVideo?.pause?.(); } catch (_) { /* ignore */ }
        meetings.forEach((m) => {
          if (m.kind === "still") {
            m._wasPlaying = !!(shotPhase === "playing" && meetings[shotIndex] === m);
          } else {
            m._wasPlaying = !!(m.video && !m.video.paused);
            try { m.video?.pause?.(); } catch (_) { /* ignore */ }
          }
        });
      } else {
        if (pauseClimbWasPlaying && climbAudio) {
          const p = climbAudio.play();
          if (p && p.catch) p.catch(() => {});
        }
        if (pauseBgWasPlaying && bgVideo) {
          const p = bgVideo.play();
          if (p && p.catch) p.catch(() => {});
        }
        meetings.forEach((m, idx) => {
          if (m._wasPlaying && shotPhase === "playing" && shotIndex === idx) {
            if (m.kind !== "still" && m.video) {
              const p = m.video.play();
              if (p && p.catch) p.catch(() => {});
            }
          }
          m._wasPlaying = false;
        });
        pauseClimbWasPlaying = false;
        pauseBgWasPlaying = false;
        lastT = performance.now(); // avoid a huge dt jump on resume
      }
    }

    function toggleExperiencePause() {
      setExperiencePaused(!experiencePaused);
    }

    function climbMediaTime() {
      if (!climbAudio || climbAudio.paused || !climbStarted) return null;
      const t = climbAudio.currentTime;
      return Number.isFinite(t) ? t : null;
    }

    /** Next beat (or every `everyN` beats) at/after song time `afterT`. */
    function nextClimbBeat(afterT, everyN = 1) {
      const step = CLIMB_BEAT * Math.max(1, everyN);
      if (afterT <= CLIMB_BEAT0) return CLIMB_BEAT0;
      const k = Math.ceil((afterT - CLIMB_BEAT0) / step - 1e-6);
      return CLIMB_BEAT0 + Math.max(0, k) * step;
    }

    /** Closest beat to song time `t` (previous or next). */
    function nearestClimbBeat(t) {
      if (t <= CLIMB_BEAT0) return CLIMB_BEAT0;
      const k = Math.round((t - CLIMB_BEAT0) / CLIMB_BEAT);
      return CLIMB_BEAT0 + Math.max(0, k) * CLIMB_BEAT;
    }

    /** Wall-clock ms until the next beat lands (accounts for playbackRate). */
    function msUntilClimbBeat(everyN = 1, minMs = 60) {
      const t = climbMediaTime();
      if (t == null) return Math.max(minMs, SHOT_GAP_MS);
      const rate = Math.max(0.5, climbAudio.playbackRate || 1);
      const target = nextClimbBeat(t + 0.03, everyN);
      return Math.max(minMs, ((target - t) / rate) * 1000);
    }

    /**
     * Wall-clock ms until the closest beat.
     * If that beat already passed (we snapped backward), cut ASAP.
     */
    function msUntilClosestClimbBeat(minMs = 40) {
      const t = climbMediaTime();
      if (t == null) return Math.max(minMs, 320);
      const rate = Math.max(0.5, climbAudio.playbackRate || 1);
      const nearest = nearestClimbBeat(t);
      if (nearest <= t + 0.015) return minMs;
      return Math.max(minMs, ((nearest - t) / rate) * 1000);
    }

    /** Wait at least `minBeats`, then land on a beat (for gaps → next overlay in). */
    function msUntilClimbBeatAfterBeats(minBeats, minMs = 80) {
      const t = climbMediaTime();
      if (t == null) return Math.max(minMs, msForClimbBeats(minBeats));
      const rate = Math.max(0.5, climbAudio.playbackRate || 1);
      const target = nextClimbBeat(t + CLIMB_BEAT * Math.max(0, minBeats) + 0.02, 1);
      return Math.max(minMs, ((target - t) / rate) * 1000);
    }

    function msForClimbBeats(n) {
      const rate = Math.max(0.5, climbAudio?.playbackRate || 1);
      if (!climbStarted || climbAudio?.paused) return SHOT_GAP_MS;
      return Math.max(120, ((CLIMB_BEAT * n) / rate) * 1000);
    }

    function currentHrForTempo() {
      if (phase === "hike" && shotPhase === "playing" && shotIndex >= 0) {
        const m = meetings[shotIndex];
        if (m) {
          const t = m.startMs + shotTime(m) * 1000;
          const s = samplePathAtTime(t);
          if (s?.hr != null) return s.hr;
        }
      }
      const s = samplePath(clamp(progress, 0, 1));
      return s?.hr ?? null;
    }

    /** 0 = low heart-rate (far/small trail), 1 = high (close/big). */
    function hrProximityN() {
      const hr = currentHrForTempo();
      if (hr == null || !Number.isFinite(hr)) return 0.5;
      // ~90 → 0, MODE_BPM (140) → ~0.5, ~190 → 1
      return clamp((hr - 90) / 100, 0, 1);
    }

    function targetClimbRate(hr) {
      if (hr == null || !Number.isFinite(hr)) return 1;
      const delta = hr - MODE_BPM;
      // 140 BPM ±2 → normal speed/pitch
      if (Math.abs(delta) <= 2) return 1;
      const excess = delta > 0 ? delta - 2 : delta + 2;
      // ~±50 BPM beyond deadzone spans toward 0.5x / 1.8x (pitch follows rate)
      return clamp(1 + (excess / 50) * 0.8, 0.5, 1.8);
    }

    function resetClimbToNormal() {
      climbTempoLive = false;
      climbTempoLocked = false;
      climbLockedRate = 1;
      climbRate = 1;
      climbOutro = false;
      climbEaseActive = false;
      climbEaseFrom = 1;
      climbEaseT = 0;
      climbEaseDur = CLIMB_NORMAL_EASE_S;
      if (!climbAudio) return;
      try { climbAudio.playbackRate = 1; } catch (_) { /* ignore */ }
      applyClimbPitchLink();
      try { climbAudio.volume = 1; } catch (_) { /* ignore */ }
      try { climbAudio.loop = false; } catch (_) { /* ignore */ }
    }

    function beginClimbOutro() {
      if (climbOutro || !climbAudio) return;
      climbOutro = true;
      climbTempoLive = false;
      try { climbAudio.loop = false; } catch (_) { /* ignore */ }
    }

    /** On the map: stop before "troubles/struggles I'm facing"; if already past, end now. */
    function watchClimbMapCut() {
      if (!finale || climbOutro || !climbAudio || !climbStarted) return;
      const t = climbAudio.currentTime;
      if (!Number.isFinite(t)) return;
      if (t >= CLIMB_CUT_AT - 0.04) beginClimbOutro();
    }

    function tickClimbOutro(dt) {
      if (!climbOutro || !climbAudio) return;
      if (climbAudio.paused && (climbAudio.volume || 0) <= 0.02) return;
      const v = Math.max(0, (climbAudio.volume ?? 1) - dt / CLIMB_OUTRO_FADE_S);
      try { climbAudio.volume = v; } catch (_) { /* ignore */ }
      if (v <= 0.02) {
        try { climbAudio.volume = 0; } catch (_) { /* ignore */ }
        try { climbAudio.pause(); } catch (_) { /* ignore */ }
      }
    }

    function lockClimbTempoAtCurrent() {
      const rate = Math.max(
        0.5,
        climbAudio?.playbackRate || climbRate || 1
      );
      climbTempoLocked = true;
      climbLockedRate = rate;
      climbRate = rate;
      climbTempoLive = true;
      applyClimbPitchLink();
      try { if (climbAudio) climbAudio.playbackRate = rate; } catch (_) { /* ignore */ }
    }

    /** Back to 1× — keep playing, stop HR drive. */
    function restoreClimbNormalPace() {
      climbTempoLocked = false;
      climbLockedRate = 1;
      climbRate = 1;
      climbTempoLive = false;
      climbEaseActive = false;
      climbEaseT = 0;
      climbEaseDur = CLIMB_NORMAL_EASE_S;
      if (!climbAudio) return;
      try { climbAudio.playbackRate = 1; } catch (_) { /* ignore */ }
      applyClimbPitchLink(); // original download pitch at 1×
    }

    /**
     * Ease back to 1× during the empty gap before the last overlay.
     * `easeS` = wall-clock seconds (usually the full gap) so the last
     * image lands already at original pace/pitch — no slide on screen.
     */
    function beginClimbNormalEaseNow(easeS) {
      if (climbEaseActive) return;
      const from = Math.max(
        0.5,
        climbAudio?.playbackRate || climbLockedRate || climbRate || 1
      );
      if (!climbAudio || Math.abs(from - 1) < 0.015) {
        restoreClimbNormalPace();
        return;
      }
      climbEaseFrom = from;
      climbEaseT = 0;
      // finish just before the gap ends so showShot hears a settled 1×
      const gapS = Number.isFinite(easeS) ? easeS : CLIMB_NORMAL_EASE_S;
      climbEaseDur = Math.max(0.45, gapS - 0.08);
      climbEaseActive = true;
      climbTempoLocked = false;
      climbTempoLive = false;
      climbRate = from;
      applyClimbPitchLink();
      try { climbAudio.playbackRate = from; } catch (_) { /* ignore */ }
    }

    function tickClimbNormalEase(dt) {
      if (!climbEaseActive || !climbAudio) return;
      applyClimbPitchLink();
      const dur = Math.max(0.2, climbEaseDur || CLIMB_NORMAL_EASE_S);
      climbEaseT = Math.min(1, climbEaseT + dt / dur);
      const s = climbEaseT * climbEaseT * (3 - 2 * climbEaseT); // smoothstep
      const rate = lerp(climbEaseFrom, 1, s);
      climbRate = rate;
      try { climbAudio.playbackRate = rate; } catch (_) { /* ignore */ }
      if (climbEaseT >= 1) restoreClimbNormalPace();
    }

    function updateClimbTempo(dt) {
      if (!climbAudio || climbAudio.paused || climbOutro) return;
      if (climbEaseActive) {
        tickClimbNormalEase(dt);
        return;
      }
      applyClimbPitchLink();
      // after the late still — hold the pushed pace until the empty gap before last
      if (climbTempoLocked) {
        if (Math.abs(climbAudio.playbackRate - climbLockedRate) > 0.002) {
          try { climbAudio.playbackRate = climbLockedRate; } catch (_) { /* ignore */ }
        }
        return;
      }
      if (!climbTempoLive || finale) return;
      const want = targetClimbRate(currentHrForTempo());
      climbRate = lerp(climbRate, want, reduced ? 1 : 1 - Math.exp(-dt * 1.6));
      if (Math.abs(climbAudio.playbackRate - climbRate) > 0.002) {
        try { climbAudio.playbackRate = climbRate; } catch (_) { /* ignore */ }
      }
    }

    function isStillFile(file) {
      return /\.(jpe?g|png|webp)$/i.test(file || "");
    }

    function fileStem(file) {
      return String(file || "").replace(/\.[^.]+$/, "").toLowerCase();
    }

    function shotMetaFromFile(file, trail = "front", extras = {}) {
      // match manifest by exact name or stem (graded .mp4 vs old .mov entries)
      const stem = fileStem(file);
      const fromManifest =
        assets.find((a) => a.file === file) ||
        assets.find((a) => fileStem(a.file) === stem);
      const still = isStillFile(file);
      // stills often sit outside the GPX local window — map onto the trail
      const startMs = still
        ? fileTimeOnTrailMs(file)
        : fromManifest?.time
          ? Date.parse(fromManifest.time)
          : fileLocalToUtcMs(file);
      const s = startMs != null ? samplePathAtTime(startMs) : null;
      // always prefer the playlist filename on disk (mp4), not a stale manifest .mov
      const src = still ? `001_STILLS/${file}` : `002_MOVING_IMAGE/${file}`;
      return {
        file,
        kind: still ? "still" : "video",
        trail: trail === "behind" ? "behind" : "front",
        lockTempoAfter: !!extras.lockTempoAfter,
        subEnd: !!extras.subEnd,
        src,
        startMs: startMs ?? Date.parse(path[0]?.t || 0),
        progress:
          (still ? s?.progress : fromManifest?.progress ?? s?.progress) ??
          pathProgressForTime(startMs ?? 0),
        ele: (still ? s?.ele : fromManifest?.ele ?? s?.ele) ?? 0,
        hr: (still ? s?.hr : fromManifest?.hr ?? s?.hr) ?? null,
      };
    }

    function shotDuration(m) {
      if (!m) return SHOT_FALLBACK_DUR;
      if (m.kind === "still") return m.stillDur || SHOT_STILL_DUR;
      const d = m.video?.duration;
      return d && isFinite(d) && d > 0.2 ? d : SHOT_FALLBACK_DUR;
    }

    function shotTime(m) {
      if (!m) return 0;
      if (m.kind === "still") return m.stillT || 0;
      return m.video?.currentTime || 0;
    }

    function pauseShotMedia(m) {
      if (!m) return;
      if (m.kind === "still") return;
      try { m.video?.pause?.(); } catch (_) { /* ignore */ }
    }

    function resetShotMedia(m) {
      if (!m) return;
      if (m.kind === "still") {
        m.stillT = 0;
        return;
      }
      try { m.video.currentTime = 0; } catch (_) { /* ignore */ }
    }

    // Sun vector in scene space (+X west after route mirror, +Y up, +Z south)
    function sunDirectionScene(ms, lat, lon) {
      const rad = Math.PI / 180;
      const date = new Date(ms);
      const yearStart = Date.UTC(date.getUTCFullYear(), 0, 0);
      const day = (ms - yearStart) / 86400000;
      const decl = 23.44 * Math.sin(rad * (360 / 365.25) * (day - 81));
      const utcHours =
        date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
      const ha = (utcHours + lon / 15 - 12) * 15; // hour angle, deg
      const latR = lat * rad;
      const decR = decl * rad;
      const haR = ha * rad;
      const sinEl =
        Math.sin(latR) * Math.sin(decR) +
        Math.cos(latR) * Math.cos(decR) * Math.cos(haR);
      const el = Math.asin(clamp(sinEl, -1, 1));
      const cosEl = Math.max(Math.cos(el), 1e-4);
      const sinAz = (-Math.cos(decR) * Math.sin(haR)) / cosEl;
      const cosAz =
        (Math.sin(decR) * Math.cos(latR) -
          Math.cos(decR) * Math.sin(latR) * Math.cos(haR)) /
        cosEl;
      const az = Math.atan2(sinAz, cosAz); // from north, toward east
      const E = Math.sin(az) * Math.cos(el);
      const N = Math.cos(az) * Math.cos(el);
      const U = Math.sin(el);
      return new THREE.Vector3(-E, U, -N).normalize();
    }

    // 0 = deep shade (matte), 1 = full sun glint — from GPX time + terrain aspect
    function computeTrailSunlit(hikePts) {
      const n = Math.min(hikePts.length, path.length);
      const raw = new Float32Array(n);
      const up = new THREE.Vector3(0, 1, 0);
      const tangent = new THREE.Vector3();
      const normal = new THREE.Vector3();
      for (let i = 0; i < n; i++) {
        const i0 = Math.max(0, i - 2);
        const i1 = Math.min(n - 1, i + 2);
        tangent.subVectors(hikePts[i1], hikePts[i0]);
        if (tangent.lengthSq() < 1e-8) {
          raw[i] = 0.45;
          continue;
        }
        tangent.normalize();
        // path-aligned terrain normal (skyward)
        normal.crossVectors(tangent, up).cross(tangent).normalize();
        if (normal.y < 0) normal.negate();
        const sun = sunDirectionScene(
          Date.parse(path[i].t),
          path[i].lat,
          path[i].lon
        );
        // face sun = lit; facing away / low sun = shade
        let lit = normal.dot(sun);
        // afternoon Dolomites: soften the transition, keep a shade floor
        lit = clamp(lit, -0.25, 1);
        const sunH = clamp(sun.y, 0, 1); // low sun → longer shade
        raw[i] = clamp(0.13 + Math.pow(Math.max(0, lit), 1.05) * (0.55 + 0.45 * sunH), 0.12, 1);
      }
      // smooth so shine patches feel like weather, not noise
      const out = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        let s = 0;
        let w = 0;
        for (let k = -5; k <= 5; k++) {
          const j = clamp(i + k, 0, n - 1);
          const ww = 1 / (1 + Math.abs(k) * 0.65);
          s += raw[j] * ww;
          w += ww;
        }
        out[i] = s / w;
      }
      return out;
    }

    function sampleSunlit(u, samples) {
      if (!samples?.length) return 1;
      const f = clamp(u, 0, 1) * (samples.length - 1);
      const i = Math.floor(f);
      const j = Math.min(i + 1, samples.length - 1);
      const t = f - i;
      return samples[i] * (1 - t) + samples[j] * t;
    }

    function makeLiquidTube(curve, tubularSegments, radialSegments, opts = {}) {
      // Viscous mercury: heavy pools, thin strands, sagging underside
      const forLetters = !!opts.forLetters;
      // faithful = keep GPX shape readable (map-like finale), still a little liquid
      const faithful = !!opts.faithful;
      const sunlitSamples = opts.sunlitSamples || null;
      const frames = curve.computeFrenetFrames(tubularSegments, false);
      const positions = [];
      const normals = [];
      const uvs = [];
      const sunlits = [];
      const indices = [];

      for (let i = 0; i <= tubularSegments; i++) {
        const u = i / tubularSegments;
        const p = curve.getPointAt(u);
        const N = frames.normals[i];
        const B = frames.binormals[i];
        const sunlit = forLetters ? 1 : sampleSunlit(u, sunlitSamples);

        // soft organic drift — lighter on letterforms / faithful hike so the route reads
        const wanderAmp = forLetters ? 0.12 : (faithful ? 0.06 : 0.55);
        const wander =
          Math.sin(u * Math.PI * 4.0) * wanderAmp +
          Math.sin(u * Math.PI * 11.0 + 1.1) * (wanderAmp * 0.45);
        const sagY = forLetters
          ? -Math.abs(Math.sin(u * Math.PI * 8.0)) * 0.12
          : faithful
            ? -Math.abs(Math.sin(u * Math.PI * 6.0)) * 0.18
            : -Math.abs(Math.sin(u * Math.PI * 5.5)) * 0.85 + Math.sin(u * Math.PI * 13.0) * 0.25;
        p.y += sagY + wander * (faithful ? 0.12 : 0.35);
        p.z += wander * (forLetters ? 0.08 : (faithful ? 0.04 : 0.2));

        const bead = Math.pow(0.5 + 0.5 * Math.sin(u * Math.PI * 7.5 + 0.4), 3.4);
        const bead2 = Math.pow(Math.max(0, Math.sin(u * Math.PI * 18.0 + 1.3)), 4.0);
        const r = forLetters
          ? 0.32 + bead * 0.08
          : faithful
            ? 0.34 + bead * 0.1 + bead2 * 0.06
            : 0.12 + bead * 0.55 + bead2 * 0.4 + 0.06 * Math.sin(u * Math.PI * 31.0) + 0.04 * Math.sin(u * Math.PI * 53.0);
        const radius = Math.max(forLetters ? 0.26 : (faithful ? 0.28 : 0.07), r);

        for (let j = 0; j <= radialSegments; j++) {
          const v = (j / radialSegments) * Math.PI * 2;
          const bump = faithful
            ? 1 + 0.08 * Math.sin(v * 3.0 + u * 10.0)
            : 1 +
              0.22 * Math.sin(v * 2.0 + u * 22.0) +
              0.14 * Math.sin(v * 5.0 - u * 11.0) +
              0.08 * Math.sin(v * 9.0 + u * 4.0);
          const cx = -Math.cos(v);
          const cy = Math.sin(v);
          const normal = new THREE.Vector3()
            .copy(N).multiplyScalar(cx)
            .addScaledVector(B, cy)
            .normalize();
          // gravity pull — heavier on the bottom of the tube
          const gravityBulge = faithful
            ? (cy < 0 ? 1 + (-cy) * 0.18 : 1)
            : (cy < 0 ? 1 + (-cy) * 0.45 : 1 - cy * 0.08);
          const vertex = new THREE.Vector3()
            .copy(p)
            .addScaledVector(normal, radius * bump * gravityBulge);
          positions.push(vertex.x, vertex.y, vertex.z);
          normals.push(normal.x, normal.y, normal.z);
          uvs.push(u, j / radialSegments);
          sunlits.push(sunlit);
        }
      }

      for (let i = 0; i < tubularSegments; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = (radialSegments + 1) * i + j;
          const b = (radialSegments + 1) * (i + 1) + j;
          const c = (radialSegments + 1) * (i + 1) + (j + 1);
          const d = (radialSegments + 1) * i + (j + 1);
          indices.push(a, b, d, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute("sunlit", new THREE.Float32BufferAttribute(sunlits, 1));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function refreshVideoEnv() {
      if (!videoTex || !pmrem) return;
      const tmp = new THREE.Scene();
      tmp.background = new THREE.Color(0xd8e6f4); // bright sky fill so metal stays silver
      // video on inside of sphere → chrome reflects the real footage
      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(12, 48, 32),
        new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.BackSide })
      );
      tmp.add(ball);
      // bright studio cards + sun disc — without these, dark rocks make chrome go black
      const card = (x, y, z, w, h, c) => {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: c })
        );
        m.position.set(x, y, z);
        m.lookAt(0, 0, 0);
        tmp.add(m);
        return m;
      };
      card(6, 7, 4, 5.5, 4.5, 0xffffff);
      card(-5, 5, 3, 4, 5.5, 0xf2f7ff);
      card(2, 9, -3, 7, 3, 0xfff8e6);
      // hot sun reflection blob in the env
      const sunDisc = new THREE.Mesh(
        new THREE.SphereGeometry(1.4, 24, 16),
        new THREE.MeshBasicMaterial({ color: 0xfff4c8 })
      );
      sunDisc.position.set(7, 9, 5);
      tmp.add(sunDisc);
      tmp.add(new THREE.AmbientLight(0xffffff, 1.35));
      const a = new THREE.DirectionalLight(0xfff6e0, 7.5);
      a.position.set(6, 10, 4);
      tmp.add(a);

      const next = pmrem.fromScene(tmp, 0.02);
      if (envRT) envRT.dispose();
      envRT = next;
      scene.environment = envRT.texture;
        if (silverMat) {
          silverMat.envMap = envRT.texture;
          applyChromeLook();
        }
      ball.geometry.dispose();
      ball.material.dispose();
    }

    function applyChromeLook() {
      if (!silverMat) return;
      // punchy mirror chrome for wordmark write + finale map
      const hero = finale || phase === "text";
      if (hero) {
        silverMat.color.setHex(0xffffff);
        silverMat.roughness = 0.002;
        silverMat.envMapIntensity = 6.4;
        silverMat.clearcoat = 1;
        silverMat.clearcoatRoughness = 0.001;
        silverMat.specularIntensity = 2.5;
        silverMat.ior = 2.4;
        if (silverMat.userData.uFinale) silverMat.userData.uFinale.value = 1;
        sun.intensity = sunBaseIntensity * 1.35;
        fill.intensity = fillBaseIntensity * 1.45;
        kick.intensity = kickBaseIntensity * 1.55;
        glint.intensity = glintBaseIntensity * 1.7;
      } else {
        silverMat.color.setHex(0xf7f9fc);
        silverMat.roughness = 0.012;
        silverMat.envMapIntensity = 3.8;
        silverMat.clearcoat = 1;
        silverMat.clearcoatRoughness = 0.01;
        silverMat.specularIntensity = 1.4;
        silverMat.ior = 2.2;
        if (silverMat.userData.uFinale) silverMat.userData.uFinale.value = 0;
        sun.intensity = sunBaseIntensity;
        fill.intensity = fillBaseIntensity;
        kick.intensity = kickBaseIntensity;
        glint.intensity = glintBaseIntensity;
      }
      silverMat.needsUpdate = true;
    }

    function makeChromeMaterial() {
      pmrem = new THREE.PMREMGenerator(renderer);
      videoTex = new THREE.VideoTexture(bgVideo);
      videoTex.colorSpace = THREE.SRGBColorSpace;
      videoTex.minFilter = THREE.LinearFilter;
      videoTex.magFilter = THREE.LinearFilter;

      // full-frame video plane so the footage is the world (not grey void)
      bgPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 2),
        new THREE.MeshBasicMaterial({ map: videoTex, depthTest: false, depthWrite: false })
      );
      bgPlane.renderOrder = -1000;
      bgPlane.frustumCulled = false;
      bgPlane.onBeforeRender = (r, s, cam) => {
        // pin to camera as a backdrop
        bgPlane.position.copy(cam.position);
        bgPlane.quaternion.copy(cam.quaternion);
        bgPlane.translateZ(-80);
        const h = 2 * Math.tan(THREE.MathUtils.degToRad(cam.fov * 0.5)) * 80;
        const w = h * cam.aspect;
        bgPlane.scale.set(w, h, 1);
      };
      scene.add(bgPlane);

      refreshVideoEnv();

      const mat = new THREE.MeshPhysicalMaterial({
        color: 0xf7f9fc,
        metalness: 1,
        roughness: 0.012,
        envMap: scene.environment,
        envMapIntensity: 3.8,
        clearcoat: 1,
        clearcoatRoughness: 0.01,
        reflectivity: 1,
        ior: 2.2,
        specularIntensity: 1.4,
      });
      mat.userData.uFinale = { value: 0 };

      // Per-vertex sunlit: full chrome in the sun, duller metal in shade
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uFinale = mat.userData.uFinale;
        shader.vertexShader = shader.vertexShader
          .replace(
            "#include <common>",
            `#include <common>
attribute float sunlit;
varying float vSunlit;`
          )
          .replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>
vSunlit = sunlit;`
          );
        shader.fragmentShader = shader.fragmentShader
          .replace(
            "#include <common>",
            `#include <common>
varying float vSunlit;
uniform float uFinale;`
          )
          .replace(
            "#include <roughnessmap_fragment>",
            `#include <roughnessmap_fragment>
float sunK = clamp(vSunlit, 0.0, 1.0);
float shadeR = mix(0.32, 0.08, uFinale);
// shade: softer, less mirror; sun: razor chrome (finale stays mirrorier)
roughnessFactor = mix(shadeR, roughnessFactor, sunK);
roughnessFactor = clamp(roughnessFactor, 0.002, 1.0);`
          )
          .replace(
            "#include <lights_physical_fragment>",
            `#include <lights_physical_fragment>
float sunK2 = clamp(vSunlit, 0.0, 1.0);
float shadeCoat = mix(0.15, 0.75, uFinale);
float shadeCoatR = mix(0.35, 0.06, uFinale);
material.clearcoat = mix(shadeCoat, material.clearcoat, sunK2);
material.clearcoatRoughness = mix(shadeCoatR, material.clearcoatRoughness, sunK2);`
          )
          .replace(
            "#include <color_fragment>",
            `#include <color_fragment>
float sunK3 = clamp(vSunlit, 0.0, 1.0);
// shade cools/deepens; finale pushes contrast (deeper shade, hotter sun)
vec3 shadeTint = mix(vec3(0.42, 0.46, 0.5), vec3(0.28, 0.31, 0.36), uFinale);
vec3 sunTint = mix(vec3(1.0), vec3(1.12, 1.12, 1.14), uFinale);
diffuseColor.rgb *= mix(shadeTint, sunTint, sunK3);`
          );
      };
      mat.customProgramCacheKey = () => "chrome-sunlit-v2-finale";
      return mat;
    }

    function layoutHikePoints() {
      // Actual hike GPX, mirrored in X so the pour starts on the left
      return path.map((p) => new THREE.Vector3(
        -p.x * scaleXZ,
        p.y * scaleY,
        p.z * scaleXZ
      ));
    }

    function layoutTextPoints() {
      // Outline GREM / PEAK — shorter write path that still reads as letters
      const W = 640;
      const H = 360;
      const c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      const g = c.getContext("2d");
      g.fillStyle = "#000";
      g.fillRect(0, 0, W, H);
      g.fillStyle = "#fff";
      g.font = "700 132px Helvetica, 'Helvetica Neue', Arial, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("GREM", W * 0.5, H * 0.32);
      g.fillText("PEAK", W * 0.5, H * 0.74);

      const data = g.getImageData(0, 0, W, H).data;
      const ink = (x, y) => {
        if (x < 0 || y < 0 || x >= W || y >= H) return false;
        return data[(y * W + x) * 4] > 200;
      };
      const step = 2;
      const edges = [];
      for (let y = 1; y < H - 1; y += step) {
        for (let x = 1; x < W - 1; x += step) {
          if (!ink(x, y)) continue;
          // edge of letterform
          if (!ink(x - step, y) || !ink(x + step, y) || !ink(x, y - step) || !ink(x, y + step)) {
            edges.push({ x, y, used: false });
          }
        }
      }
      if (!edges.length) return [new THREE.Vector3(0, 8, 0)];

      // write each line L→R by chaining nearest edges (GREM then PEAK)
      const ordered = [];
      for (const [y0, y1] of [[0, H * 0.52], [H * 0.52, H]]) {
        const pool = edges.filter((p) => p.y >= y0 && p.y < y1 && !p.used);
        if (!pool.length) continue;
        let cur = pool.reduce((a, b) => (a.x + a.y * 0.15 < b.x + b.y * 0.15 ? a : b));
        cur.used = true;
        ordered.push(cur);
        for (;;) {
          let next = null;
          let best = 40;
          for (const p of pool) {
            if (p.used) continue;
            const d = Math.hypot(p.x - cur.x, p.y - cur.y);
            if (d < best) {
              best = d;
              next = p;
            }
          }
          if (!next) {
            // jump to next unused leftmost
            const rest = pool.filter((p) => !p.used);
            if (!rest.length) break;
            next = rest.reduce((a, b) => (a.x + a.y * 0.2 < b.x + b.y * 0.2 ? a : b));
          }
          next.used = true;
          ordered.push(next);
          cur = next;
        }
      }

      const worldW = 58;
      const worldH = 32;
      return ordered.map((p) => new THREE.Vector3(
        (p.x / W - 0.5) * worldW,
        (0.55 - p.y / H) * worldH + 11,
        0
      ));
    }

    function setActiveCurve(kind) {
      if (kind === "text") {
        phase = "text";
        curve = textCurve;
        liquidMesh = textMesh;
        tubularSegs = textTubular;
        hikeMesh.visible = false;
        textMesh.visible = true;
        if (textGround) textGround.visible = true;
        if (groundMesh) groundMesh.visible = false;
        progress = 0;
        target = 0;
        textProgress = 0;
        lastProgress = 0;
        beginHikeAt = 0;
        textExit = 0;
        climbStarted = false;
        climbTempoLive = false;
        climbTempoLocked = false;
        climbLockedRate = 1;
        climbOutro = false;
        climbEaseActive = false;
        climbEaseFrom = 1;
        climbEaseT = 0;
        try {
          if (climbAudio) {
            climbAudio.volume = 1;
            climbAudio.loop = false;
          }
        } catch (_) { /* ignore */ }
        textMesh.position.set(0, 0, 0);
        if (textGround) textGround.position.set(0, 2, 0);
        liquidMesh.geometry.setDrawRange(0, 6);
        markers.forEach((m) => { m.mesh.visible = false; });
        // fixed hero camera on the wordmark
        camPos.set(0, 12, 36);
        look.set(0, 11, 0);
        camera.position.copy(camPos);
        camera.lookAt(look);
        groundY = 2;
        applyChromeLook();
      } else {
        phase = "hike";
        curve = hikeCurve;
        liquidMesh = hikeMesh;
        tubularSegs = hikeTubular;
        // PEAK GREM stays briefly, then slides off left as trail takes over
        textMesh.visible = true;
        hikeMesh.visible = true;
        if (textGround) textGround.visible = true;
        if (groundMesh) groundMesh.visible = true;
        progress = 0;
        target = 0;
        lastProgress = 0;
        textExit = 0;
        finale = false;
        finaleT = 0;
        applyChromeLook();
        shotPhase = "idle";
        shotIndex = -1;
        liquidMesh.geometry.setDrawRange(0, 6);
        groundY = groundMesh.position.y;
        // pick trail camera side; ease from wordmark cam (no hard cut)
        const p0 = hikeCurve.getPointAt(0.001);
        const t0 = hikeCurve.getTangentAt(0.001).normalize();
        const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), t0).normalize();
        if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
        hikeSideSign = side.x > 0 ? -1 : 1;
        hikeAutoPour = true;
      }
      if (pourTip) pourTip.visible = true;
      if (pourStream) pourStream.visible = true;
      resize();
    }

    function startTextPhase() {
      setActiveCurve("text");
      // song kicks in shortly after click-in, from 1.5s in the track
      setTimeout(() => {
        if (isLive && !experiencePaused) startClimbAudio();
      }, CLIMB_START_DELAY * 1000);
    }

    function shotOverlayVisible() {
      return (
        phase === "hike" &&
        (shotPhase === "playing" || shotPhase === "fadingOut")
      );
    }

    function activeShotTrail() {
      if (!shotOverlayVisible() || shotIndex < 0) return null;
      return meetings[shotIndex]?.trail === "behind" ? "behind" : "front";
    }

    function applyTrailLayer(trail) {
      if (!stageEl) return;
      stageEl.classList.toggle("trail-behind", trail === "behind");
    }

    /** Pin #shotHud frame to the active media box so red subs sit on the asset. */
    function syncShotHud(m) {
      if (!shotHud || !shotHudFrame || !stageEl || !m) return;
      const media = m.img || m.video;
      if (!media) return;
      const stageR = stageEl.getBoundingClientRect();
      const r = media.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      shotHudFrame.style.left = `${r.left - stageR.left}px`;
      shotHudFrame.style.top = `${r.top - stageR.top}px`;
      shotHudFrame.style.width = `${r.width}px`;
      shotHudFrame.style.height = `${r.height}px`;
    }

    function hideAllShots() {
      meetings.forEach((m) => {
        m.el.classList.remove("on");
        pauseShotMedia(m);
      });
      if (shotHud) {
        shotHud.classList.remove("on");
        shotHud.setAttribute("aria-hidden", "true");
      }
      applyTrailLayer(null);
      shotFadeThen = null;
    }

    // Map playlist time → GPX pour 0…1 (equal slice per overlay — stable, finishes with last shot)
    function pourProgressFromPlaylist() {
      if (!meetings.length) return 0;
      if (finale || shotPhase === "done") return 1;
      if (shotIndex < 0 || shotPhase === "idle" || shotPhase === "waitFirst") return 0;
      if (shotPhase === "fadingOut" && shotFadeThen === "finale") return 1;

      const n = meetings.length;
      if (shotPhase === "gap" || shotPhase === "fadingOut") {
        // hold at end of this shot's slice during fade / gap
        return clamp((shotIndex + 1) / n, 0, 0.999);
      }

      const m = meetings[shotIndex];
      const dur = shotDuration(m);
      const u = clamp(shotTime(m) / dur, 0, 1);
      return clamp((shotIndex + u) / n, 0, 0.999);
    }

    function updateShotSub(m) {
      if (!m) return;
      // COROS ele / BPM at the clip's hike time (+ playhead)
      const t = m.startMs + shotTime(m) * 1000;
      const s = samplePathAtTime(t);
      const line = formatSub(s?.ele ?? m.ele, s?.hr ?? m.hr, { end: !!m.subEnd });
      if (m.sub) m.sub.textContent = line;
      if (shotSub) shotSub.textContent = line;
    }

    function showShot(i) {
      if (i < 0 || i >= meetings.length) {
        shotPhase = "done";
        shotIndex = Math.max(0, meetings.length - 1);
        hideAllShots();
        return;
      }
      shotIndex = i;
      shotPhase = "playing";
      // BPM tempo drive begins with the first overlay (song already playing from PEAK)
      if (i === 0) climbTempoLive = true;
      // last overlay — gap ease should already be done; settle on original 1× (no slide)
      if (i === meetings.length - 1 || meetings[i]?.subEnd) {
        restoreClimbNormalPace();
      }
      applyTrailLayer(meetings[i]?.trail);
      if (shotHud) {
        shotHud.classList.add("on");
        shotHud.setAttribute("aria-hidden", "false");
      }
      meetings.forEach((m, idx) => {
        const on = idx === i;
        m.el.classList.toggle("on", on);
        if (on) {
          if (m.kind === "still") {
            resetShotMedia(m);
            updateShotSub(m);
            syncShotHud(m);
            // layout after image decode / paint
            requestAnimationFrame(() => syncShotHud(m));
            return;
          }
          m.video.loop = false;
          const start = () => {
            updateShotSub(m);
            syncShotHud(m);
            requestAnimationFrame(() => syncShotHud(m));
            const p = m.video.play();
            if (p && p.catch) {
              p.catch(() => {
                setTimeout(() => {
                  if (shotIndex === idx && shotPhase === "playing") onShotEnded();
                }, 600);
              });
            }
          };
          if (m.video.readyState >= 2) {
            resetShotMedia(m);
            start();
          } else {
            const onReady = () => {
              resetShotMedia(m);
              start();
            };
            m.video.addEventListener("loadeddata", onReady, { once: true });
            // safety: if metadata never arrives, skip
            setTimeout(() => {
              if (shotIndex === idx && shotPhase === "playing" && m.video.readyState < 2) {
                onShotEnded();
              }
            }, 8000);
          }
        } else {
          pauseShotMedia(m);
        }
      });
    }

    function revealFullTrail() {
      progress = 1;
      target = 1;
      if (hikeMesh && radialSegs) {
        const idxCount = hikeMesh.geometry.index ? hikeMesh.geometry.index.count : 0;
        hikeMesh.geometry.setDrawRange(0, idxCount || (hikeTubular * radialSegs * 6));
      }
    }

    function applyFinaleCaptionStep() {
      finaleLine1?.classList.toggle("on", finaleCaptionStep >= 1);
      finaleLine2?.classList.toggle("on", finaleCaptionStep >= 2);
      if (finaleLabel) {
        const show = finale && finaleCaptionStep >= 1;
        finaleLabel.classList.toggle("on", show);
        finaleLabel.setAttribute("aria-hidden", show ? "false" : "true");
      }
    }

    function syncFinaleLabel() {
      if (!finaleLabel || !finale || !stageEl) {
        if (finaleLabel) {
          finaleLabel.classList.remove("on");
          finaleLabel.setAttribute("aria-hidden", "true");
        }
        finaleLine1?.classList.remove("on");
        finaleLine2?.classList.remove("on");
        return;
      }
      const w = stageEl.clientWidth;
      const h = stageEl.clientHeight;
      _tmp.copy(trailPeak);
      _tmp.project(camera);
      if (_tmp.z > 1) return;
      const x = (_tmp.x * 0.5 + 0.5) * w;
      const y = (-_tmp.y * 0.5 + 0.5) * h;
      finaleLabel.style.left = `${x}px`;
      finaleLabel.style.top = `${y}px`;
      applyFinaleCaptionStep();
    }

    function tickFinaleCaption(dt) {
      if (!finale || finaleCaptionStep >= 2) return;
      finaleCaptionTimer -= dt * 1000;
      if (finaleCaptionTimer > 0) return;
      finaleCaptionStep += 1;
      applyFinaleCaptionStep();
      syncFinaleLabel();
      if (finaleCaptionStep < 2) {
        finaleCaptionTimer = 2000; // with love x — 2s after LAGAZUOI
      }
    }

    function beginFinale() {
      if (finale || phase !== "hike") return;
      finale = true;
      finaleT = 0;
      hikeAutoPour = false;
      shotPhase = "done";
      hideAllShots();
      revealFullTrail();
      try { if (climbAudio) climbAudio.loop = false; } catch (_) { /* ignore */ }
      if (pourTip) pourTip.visible = false;
      if (pourStream) pourStream.visible = false;
      // no ground shadow on the final map beat
      if (groundMesh) groundMesh.visible = false;
      if (hikeMesh) hikeMesh.castShadow = false;
      markers.forEach((m) => { m.mesh.castShadow = false; });
      clearDrips();
      applyChromeLook();
      // seed camera centred above the route (~10% larger than prior finale fit)
      const height = trailSpanXZ * 1.665;
      camPos.set(trailCenter.x, trailCenter.y + height, trailCenter.z);
      look.copy(trailCenter);
      camera.position.copy(camPos);
      camera.lookAt(look);
      resize();
      // map alone first; LAGAZUOI at 2s, with love x 2s after that
      finaleCaptionStep = 0;
      finaleCaptionTimer = 2000;
      applyFinaleCaptionStep();
      syncFinaleLabel();
      // fade out after the verse (or immediately if already past the cut)
      watchClimbMapCut();
    }

    function beginOverlayFadeOut(then) {
      const active = meetings[shotIndex];
      // leaving the late still — freeze song at whatever pace it reached
      if (active?.lockTempoAfter && !climbTempoLocked) {
        lockClimbTempoAtCurrent();
      }
      if (active) {
        active.el.classList.remove("on");
        pauseShotMedia(active);
      }
      if (shotHud) {
        shotHud.classList.remove("on");
        shotHud.setAttribute("aria-hidden", "true");
      }
      shotFadeThen = then;
      shotPhase = "fadingOut";
      shotTimer = SHOT_FADE_MS;
    }

    function onShotEnded() {
      if (phase !== "hike" || shotPhase !== "playing") return;
      const active = meetings[shotIndex];
      if (active) pauseShotMedia(active);
      beginOverlayFadeOut(
        shotIndex + 1 >= meetings.length ? "finale" : "gap"
      );
    }

    function goToGap() {
      shotPhase = "gap";
      // clear trail layer so the empty gap stays metal-only (no z-index flash)
      applyTrailLayer(null);
      // next is the last overlay — hold ~2s longer before it arrives
      const nextIsLast = shotIndex + 1 === meetings.length - 1;
      shotTimer = SHOT_GAP_MS + (nextIsLast ? SHOT_LAST_EXTRA_GAP_MS : 0);
      // empty black only: ease tempo/pitch back so the last image lands at original 1×
      if (nextIsLast) beginClimbNormalEaseNow(shotTimer / 1000);
    }

    function tickShots(dt) {
      if (phase !== "hike" || shotPhase === "done" || shotPhase === "idle" || finale) return;

      if (shotPhase === "waitFirst") {
        shotTimer -= dt * 1000;
        if (shotTimer <= 0) showShot(0);
        return;
      }

      if (shotPhase === "fadingOut") {
        shotTimer -= dt * 1000;
        if (shotTimer > 0) return;
        const then = shotFadeThen;
        shotFadeThen = null;
        if (then === "finale") {
          shotPhase = "done";
          revealFullTrail();
          beginFinale();
          return;
        }
        goToGap();
        return;
      }

      if (shotPhase === "playing" && shotIndex >= 0) {
        const m = meetings[shotIndex];
        if (!m) return;
        if (m.kind === "still") m.stillT = (m.stillT || 0) + dt;
        updateShotSub(m);
        syncShotHud(m);
        const dur = shotDuration(m);
        const tVid = shotTime(m);
        const nearEnd =
          (m.kind === "video" && m.video?.ended) ||
          (dur > 0 && isFinite(dur) && tVid >= dur - 0.08);
        if (nearEnd) onShotEnded();
        return;
      }
      if (shotPhase === "gap") {
        shotTimer -= dt * 1000;
        if (shotTimer <= 0) showShot(shotIndex + 1);
      }
    }

    function startHikePhase() {
      setActiveCurve("hike");
      shotPhase = "waitFirst";
      shotIndex = -1;
      shotTimer = 420;
    }

    function spawnDrip(origin, force = 1) {
      if (drips.length >= MAX_DRIPS) {
        const old = drips.shift();
        scene.remove(old.mesh);
        old.mesh.geometry.dispose();
      }
      const s = 0.06 + Math.random() * 0.14 * force;
      const geo = new THREE.SphereGeometry(s, 12, 10);
      // stretch into a tear while falling
      const mesh = new THREE.Mesh(geo, silverMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.copy(origin);
      mesh.position.x += (Math.random() - 0.5) * 0.28;
      mesh.position.z += (Math.random() - 0.5) * 0.28;
      mesh.position.y += 0.1 + Math.random() * 0.35;
      mesh.scale.set(1, 1.15 + Math.random() * 0.35, 1);
      scene.add(mesh);
      drips.push({
        mesh,
        vel: new THREE.Vector3(
          (Math.random() - 0.5) * 0.7,
          -2.4 - Math.random() * 2.6 * force,
          (Math.random() - 0.5) * 0.7
        ),
        life: 1.4 + Math.random() * 1.1,
        age: 0,
        radius: s,
        settled: false,
        spread: 0,
        baseScale: { x: 1, y: 1, z: 1 },
      });
    }

    function spawnDripAlongHike(origin, tangent, force = 1) {
      spawnDrip(origin, force);
      const d = drips[drips.length - 1];
      if (!d || !tangent) return;
      // carry droplets forward along the trail
      d.vel.addScaledVector(tangent, 0.9 * force + Math.random() * 0.5);
      d.vel.y = -2.4 - Math.random() * 2.6 * force;
    }

    function clearDrips() {
      for (let i = drips.length - 1; i >= 0; i--) {
        scene.remove(drips[i].mesh);
        drips[i].mesh.geometry.dispose();
      }
      drips.length = 0;
    }

    function updatePour(dt) {
      if (!curve || !liquidMesh || phase === "intro") return;

      // finale map: full clean route, no drip particles
      if (finale) {
        const idxCount = liquidMesh.geometry.index ? liquidMesh.geometry.index.count : 0;
        liquidMesh.geometry.setDrawRange(0, idxCount || (tubularSegs * radialSegs * 6));
        if (pourTip) pourTip.visible = false;
        if (pourStream) pourStream.visible = false;
        if (drips.length) clearDrips();
        return;
      }

      const u = clamp(progress, 0.001, 0.999);
      // reveal trail as if poured up to here
      const segs = Math.max(12, Math.floor(u * tubularSegs));
      liquidMesh.geometry.setDrawRange(0, segs * radialSegs * 6);

      curve.getPointAt(u, _tip);
      const tan = curve.getTangentAt(u).normalize();

      // soft contact shadows under the pour tip — keep frustum locked on trail
      sun.position.set(_tip.x + 45, _tip.y + 110, _tip.z + 55);
      sun.target.position.copy(_tip);
      sun.target.updateMatrixWorld();
      glint.position.set(_tip.x - 35, _tip.y + 95, _tip.z - 50);
      glint.target.position.copy(_tip);
      glint.target.updateMatrixWorld();
      const sc = sun.shadow.camera;
      const extent = phase === "text" ? 55 : 95;
      sc.left = -extent;
      sc.right = extent;
      sc.top = extent;
      sc.bottom = -extent;
      sc.near = 1;
      sc.far = 520;
      sc.updateProjectionMatrix();
      sun.shadow.camera.updateMatrixWorld();

      if (pourTip) {
        pourTip.position.copy(_tip);
        pourTip.position.y += 0.25;
        const pulse = 0.9 + Math.sin(performance.now() * 0.014) * 0.2;
        const hrSize = phase === "hike" ? lerp(0.85, 1.25, hrViz) : 1;
        pourTip.scale.setScalar(pulse * (phase === "text" ? 0.85 : 1) * hrSize);
      }
      if (pourStream) {
        pourStream.position.copy(_tip).addScaledVector(tan, -0.65);
        pourStream.position.y -= 0.25;
        const flow = 1 + Math.min(2.4, Math.abs(progress - lastProgress) * 140);
        const hrW = phase === "hike" ? lerp(0.85, 1.2, hrViz) : 1;
        pourStream.scale.set(0.5 * hrW, 0.5 * hrW, flow * 1.6);
        pourStream.lookAt(_tip.x + tan.x, _tip.y + tan.y, _tip.z + tan.z);
      }

      // spawn drips while pouring / writing — GREM PEAK + trail leave expanding puddles
      const dProg = progress - lastProgress;
      const dripMul = phase === "text" ? 0.55 : 0.85;
      if (dProg > 0.00001) {
        pourCarry += dProg * (reduced ? 18 : (phase === "text" ? 140 : 210)) * dripMul;
        while (pourCarry > 1) {
          pourCarry -= 1;
          _tmp.copy(_tip).addScaledVector(tan, -0.2);
          _tmp.y += 0.35;
          // occasional side drip so puddles mark the path, not only the tip
          if (phase === "hike" && Math.random() < 0.45) {
            _tmp.addScaledVector(tan, (Math.random() - 0.5) * 1.2);
            _tmp.x += (Math.random() - 0.5) * 1.8;
            _tmp.z += (Math.random() - 0.5) * 1.8;
          }
          spawnDripAlongHike(_tmp, tan, 0.4 + Math.min(0.75, dProg * 160));
        }
        if (Math.random() < dProg * (phase === "text" ? 5.5 : 6.5) * dripMul) {
          spawnDripAlongHike(_tip, tan, phase === "text" ? 0.65 : 0.7);
        }
      } else if (!reduced && phase === "hike" && Math.random() < 0.035) {
        // keep a light drip rain along the tip during overlay gaps / holds
        _tmp.copy(_tip);
        _tmp.x += (Math.random() - 0.5) * 2.2;
        _tmp.z += (Math.random() - 0.5) * 2.2;
        spawnDripAlongHike(_tmp, tan, 0.4);
      }
      lastProgress = progress;

      // integrate drips — landed puddles stay visible and keep casting shadow
      for (let i = drips.length - 1; i >= 0; i--) {
        const d = drips[i];
        d.age += dt;
        if (d.settled) {
          d.life -= dt;
          d.spread = Math.min(1, (d.spread || 0) + dt * 2.4);
          // ease-out expand across the floor
          const spreadK = 1 - Math.pow(1 - d.spread, 2.4);
          let sx = d.baseScale.x * (0.35 + 0.65 * spreadK);
          let sy = d.baseScale.y;
          let sz = d.baseScale.z * (0.35 + 0.65 * spreadK);
          d.mesh.position.y = groundY + d.radius * 0.1;
          d.mesh.castShadow = true;
          // hold size, then ease out near the end
          if (d.life < 1.2) {
            const k = Math.max(0.12, d.life / 1.2);
            sx *= k;
            sy *= k;
            sz *= k;
          }
          d.mesh.scale.set(sx, sy, sz);
          if (d.life <= 0) {
            scene.remove(d.mesh);
            d.mesh.geometry.dispose();
            drips.splice(i, 1);
          }
          continue;
        }

        d.vel.y -= 26 * dt; // stronger gravity
        d.vel.x *= 1 - 0.25 * dt;
        d.vel.z *= 1 - 0.4 * dt;
        d.mesh.position.addScaledVector(d.vel, dt);

        // elongate while falling fast
        const stretch = 1 + Math.min(1.8, Math.abs(d.vel.y) * 0.06);
        d.mesh.scale.set(1 / Math.sqrt(stretch), stretch, 1 / Math.sqrt(stretch));

        // hit ground → flat mercury that spreads out on the floor / trail
        if (d.mesh.position.y - d.radius * 0.5 <= groundY) {
          const hike = phase === "hike";
          const sx = (hike ? 3.2 : 2.6) + Math.random() * (hike ? 2.8 : 2.2);
          const sy = 0.16;
          const sz = (hike ? 3.2 : 2.6) + Math.random() * (hike ? 2.8 : 2.2);
          d.mesh.position.y = groundY + d.radius * 0.1;
          d.vel.set(0, 0, 0);
          d.mesh.scale.set(sx * 0.35, sy, sz * 0.35);
          d.baseScale = { x: sx, y: sy, z: sz };
          d.spread = 0; // 0→1 expand on floor
          d.settled = true;
          d.life = (hike ? 6.5 : 3.8) + Math.random() * (hike ? 3.5 : 2.2);
          d.mesh.castShadow = true;
        } else if (d.age > 4) {
          scene.remove(d.mesh);
          d.mesh.geometry.dispose();
          drips.splice(i, 1);
        }
      }
    }

    function buildTrail() {
      silverMat = makeChromeMaterial();
      radialSegs = 40;

      // --- GREM PEAK wordmark pour ---
      const textPts = layoutTextPoints();
      textCurve = new THREE.CatmullRomCurve3(textPts, false, "catmullrom", 0.05);
      textTubular = Math.min(1400, Math.max(600, textPts.length));
      textMesh = new THREE.Mesh(makeLiquidTube(textCurve, textTubular, radialSegs, { forLetters: true }), silverMat);
      textMesh.castShadow = true;
      textMesh.receiveShadow = true;
      textMesh.visible = false;
      textMesh.geometry.setDrawRange(0, 6);
      scene.add(textMesh);

      // shadow catcher under the wordmark (the drip shadows you like)
      textGround = new THREE.Mesh(
        new THREE.PlaneGeometry(70, 40),
        new THREE.ShadowMaterial({ opacity: 0.55, color: 0x000000 })
      );
      textGround.rotation.x = -Math.PI / 2;
      textGround.position.set(0, 2, 0);
      textGround.receiveShadow = true;
      textGround.visible = false;
      scene.add(textGround);

      // --- GPX hike pour ---
      const hikePts = layoutHikePoints();
      const trailSunlit = computeTrailSunlit(hikePts);
      // slightly tensioned curve so switchbacks stay sharp like the map
      hikeCurve = new THREE.CatmullRomCurve3(hikePts, false, "catmullrom", 0.05);
      hikeTubular = Math.min(1600, Math.max(800, hikePts.length * 4));
      hikeMesh = new THREE.Mesh(
        makeLiquidTube(hikeCurve, hikeTubular, radialSegs, {
          sunlitSamples: trailSunlit,
          faithful: true,
        }),
        silverMat
      );
      hikeMesh.castShadow = true;
      hikeMesh.receiveShadow = true;
      hikeMesh.visible = false;
      hikeMesh.geometry.setDrawRange(0, 6);
      scene.add(hikeMesh);

      let minY = Infinity, maxY = -Infinity;
      let minX = Infinity, maxX = -Infinity;
      let minZ = Infinity, maxZ = -Infinity;
      for (const p of hikePts) {
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
      }
      // keep ground close under the trail so contact shadows + landed drips stay in frame
      groundY = minY - 2.4;
      const span = Math.max(maxX - minX, maxZ - minZ, 80) * 1.75;
      trailCenter.set((minX + maxX) * 0.5, (minY + maxY) * 0.45, (minZ + maxZ) * 0.5);
      trailSpan = Math.max(maxX - minX, maxZ - minZ, maxY - minY, 48);
      trailSpanXZ = Math.max(maxX - minX, maxZ - minZ, 48);
      // highest end of the route (for finale caption)
      let peak = hikePts[0];
      for (let i = 1; i < hikePts.length; i++) {
        if (hikePts[i].y > peak.y) peak = hikePts[i];
      }
      trailPeak.copy(peak);

      groundMat = new THREE.ShadowMaterial({ opacity: 0.62, color: 0x000000 });
      groundMesh = new THREE.Mesh(new THREE.CircleGeometry(span, 80), groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.set((minX + maxX) * 0.5, groundY, (minZ + maxZ) * 0.5);
      groundMesh.receiveShadow = true;
      groundMesh.visible = false;
      scene.add(groundMesh);

      pourTip = new THREE.Mesh(new THREE.SphereGeometry(0.42, 28, 24), silverMat);
      pourTip.castShadow = true;
      pourTip.visible = false;
      scene.add(pourTip);
      pourStream = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14), silverMat);
      pourStream.castShadow = true;
      pourStream.visible = false;
      scene.add(pourStream);

      sun.target.position.set(0, 10, 0);
      scene.add(sun.target);

      // default inactive until text/hike phase
      curve = textCurve;
      liquidMesh = textMesh;
      tubularSegs = textTubular;

      markers = assets.map((a) => {
        const u = clamp(a.progress, 0.001, 0.999);
        const pt = hikeCurve.getPointAt(u);
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.55 + Math.random() * 0.45, 24, 20),
          silverMat
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.visible = false;
        mesh.position.copy(pt);
        mesh.position.y += 0.35;
        mesh.scale.set(1.1, 0.75, 1.1);
        scene.add(mesh);
        return { mesh, progress: a.progress };
      });
    }

    function updateCamera() {
      if (!curve) return;

      if (phase === "text") {
        // hold centre on the wordmark while it writes
        const desiredPos = new THREE.Vector3(0, 14, 42);
