        const desiredLook = new THREE.Vector3(0, 10, 0);
        camPos.lerp(desiredPos, reduced ? 1 : 0.06);
        look.lerp(desiredLook, reduced ? 1 : 0.06);
        camera.position.copy(camPos);
        camera.lookAt(look);
        return;
      }

      if (phase !== "hike") return;

      // after last overlay — centred metal map, soft idle, no shadow
      if (finale) {
        const fit = trailSpanXZ * 0.828; // ~10% larger on screen vs prior 0.92
        const fovRad = THREE.MathUtils.degToRad(camera.fov);
        const height =
          (fit / Math.tan(fovRad * 0.5)) * 1.05 +
          Math.sin(finaleT * 0.32) * 1.2;
        // gentle orbit kept small so the map stays optically centered
        const desiredPos = new THREE.Vector3(
          trailCenter.x + Math.sin(finaleT * 0.14) * 0.55,
          trailCenter.y + height,
          trailCenter.z + Math.cos(finaleT * 0.12) * 0.55
        );
        const desiredLook = new THREE.Vector3(
          trailCenter.x,
          trailCenter.y + trailSpan * 0.04,
          trailCenter.z
        );
        const ease = reduced ? 1 : 0.045;
        camPos.lerp(desiredPos, ease);
        look.lerp(desiredLook, ease);
        camera.position.copy(camPos);
        camera.lookAt(look);
        markers.forEach((m) => {
          m.mesh.visible = true;
          m.mesh.castShadow = false;
          m.mesh.scale.set(0.95, 0.65, 0.95);
        });
        syncFinaleLabel();
        return;
      }

      const u = clamp(progress, 0.001, 0.999);
      const p = curve.getPointAt(u);
      const t = curve.getTangentAt(u).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      const side = new THREE.Vector3().crossVectors(up, t).normalize();
      if (side.lengthSq() < 1e-6) side.set(1, 0, 0);

      const here = samplePath(progress);
      speedN = here?.spdN ?? 0;

      // BPM → camera: higher HR pulls in closer (trail reads bigger), lower pushes out
      hrViz = lerp(hrViz, hrProximityN(), reduced ? 1 : 0.05);
      const distMul = lerp(1.36, 0.56, hrViz); // far ← low BPM ····· high BPM → close
      const markMul = lerp(0.9, 1.22, hrViz);

      // elevated route view — path shape on the left, ground/shadows/drops along the bottom
      const poured = curve.getPointAt(clamp(u - 0.1, 0.001, 0.999));
      const ahead = curve.getPointAt(clamp(u + 0.06, 0.001, 0.999));
      const lateral = (52 - speedN * 6) * hikeSideSign * distMul;
      const height = (46 + (here?.eleN ?? 0) * 10) * distMul;
      const back = 6 * distMul;

      const desiredPos = p.clone()
        .addScaledVector(side, lateral)
        .addScaledVector(up, height)
        .addScaledVector(t, -back);
      const desiredLook = poured.clone()
        .lerp(ahead, 0.62)
        .addScaledVector(side, 30 * hikeSideSign * Math.min(1.15, distMul))
        .addScaledVector(up, -4);

      const ease = reduced ? 1 : 0.035;
      camPos.lerp(desiredPos, ease);
      look.lerp(desiredLook, ease);
      camera.position.copy(camPos);
      camera.lookAt(look);

      markers.forEach((m) => {
        const pouredMark = m.progress <= progress + 0.01;
        m.mesh.visible = pouredMark;
        if (pouredMark) {
          const near = Math.abs(m.progress - progress) < 0.04;
          const b = (near ? 1.35 : 1.1) * markMul;
          const h = (near ? 0.9 : 0.75) * markMul;
          m.mesh.scale.set(b, h, b);
        }
      });
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      if (finale) {
        camera.fov = 32;
        // small left nudge — AABB center reads slightly right on this route
        const nudge = Math.round(w * 0.045);
        camera.setViewOffset(w, h, nudge, 0, w, h);
      } else if (phase === "hike" && w > 640) {
        // pin the hike route into the left third; center stays clear for media
        camera.fov = 42;
        const shiftX = Math.round(w * 0.3);
        const shiftY = Math.round(h * -0.04);
        camera.setViewOffset(w, h, shiftX, shiftY, w, h);
      } else {
        camera.fov = 38;
        camera.clearViewOffset();
      }
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      if (shotOverlayVisible() && shotIndex >= 0) syncShotHud(meetings[shotIndex]);
    }

    function readScroll() {
      // pour is playlist-driven — scroll does not control the metal
    }

    function tick() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      if (isLive && !experiencePaused) {
        if (phase === "text") {
          // auto-write GREM PEAK with dripping metal
          const dur = reduced ? 0.2 : 11;
          textProgress = Math.min(1, textProgress + dt / dur);
          progress = textProgress;
          target = textProgress;
          updatePour(dt);
          updateCamera();
          if (textProgress >= 1) {
            // continue straight into trail metal — no hold
            startHikePhase();
          }
        } else if (phase === "hike") {
          if (finale) {
            finaleT += dt;
            progress = 1;
            target = 1;
            tickFinaleCaption(dt);
            watchClimbMapCut();
            tickClimbOutro(dt);
            updatePour(dt);
            updateCamera();
          } else {
            tickShots(dt);
            // metal follows the overlay playlist — each clip pours its slice of the GPX
            target = pourProgressFromPlaylist();
            progress = lerp(progress, target, reduced ? 1 : 0.12);
            if (Math.abs(progress - target) < 0.00005) progress = target;
            updatePour(dt);
            updateCamera();
          }

          // once camera falls back onto the trail, slide PEAK GREM off left
          if (textMesh?.visible) {
            const exitDur = reduced ? 0.15 : 3.6;
            textExit = Math.min(1, textExit + dt / exitDur);
            const e = textExit * textExit * (3 - 2 * textExit); // smoothstep
            textMesh.position.x = -92 * e;
            textMesh.position.y = -6 * e;
            if (textGround) {
              textGround.position.x = -92 * e;
              textGround.position.y = 2 - 6 * e;
            }
            if (textExit >= 1) {
              textMesh.visible = false;
              if (textGround) textGround.visible = false;
            }
          }
        }

        updateClimbTempo(dt);

        if (now - lastEnvRefresh > 1800 && bgVideo.readyState >= 2) {
          lastEnvRefresh = now;
          refreshVideoEnv();
        }
      }

      // overlays live above #map; keep full-frame WebGL bg off during hike
      const overlayUp = shotOverlayVisible();
      const trailFront = overlayUp && activeShotTrail() !== "behind";
      if (bgPlane) bgPlane.visible = phase !== "hike";
      if (groundMesh && phase === "hike" && !finale) groundMesh.visible = !trailFront;
      if (overlayUp && shotIndex >= 0) syncShotHud(meetings[shotIndex]);

      renderer.setClearColor(0x000000, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    async function main() {
      try {
        const manifest = await fetch("./manifest.json?v=pour5").then((r) => {
          if (!r.ok) throw new Error("manifest.json missing");
          return r.json();
        });

        path = manifest.path || [];
        assets = manifest.assets || [];

        bgVideo.muted = true;
        bgVideo.playsInline = true;
        try { await bgVideo.play(); } catch (_) { /* autoplay may need a gesture */ }

        // playlist shots (cut edits) — markers still follow these points on the trail
        assets = SHOT_PLAYLIST.map((s) =>
          shotMetaFromFile(s.file, s.trail, {
            lockTempoAfter: s.lockTempoAfter,
            subEnd: s.subEnd,
          })
        );

        buildTrail();

        const start = samplePath(0);
        if (start) {
          // mirrored X to match layoutHikePoints
          camPos.set(-start.x * scaleXZ + 40, start.y * scaleY + 28, start.z * scaleXZ + 36);
          look.set(-start.x * scaleXZ, start.y * scaleY + 4, start.z * scaleXZ);
        }

        assets.forEach((a) => {
          const el = document.createElement("div");
          el.className = "meeting";
          const subLine = formatSub(a.ele, a.hr, { end: !!a.subEnd });
          const media =
            a.kind === "still"
              ? `<img src="${a.src}" alt="" decoding="async" />`
              : `<video muted playsinline preload="auto" src="${a.src}"></video>`;
          el.innerHTML = `
            <div class="meeting-frame">
              ${media}
              <p class="sub">${subLine}</p>
            </div>
          `;
          meetingsEl.appendChild(el);
          const video = el.querySelector("video");
          if (video) {
            video.loop = false;
            video.preload = "auto";
            // only end the shot if THIS clip is the active one
            video.addEventListener("ended", () => {
              if (meetings[shotIndex]?.video === video && shotPhase === "playing") {
                onShotEnded();
              }
            });
          }
          const img = el.querySelector("img");
          if (img) {
            img.addEventListener("load", () => {
              if (meetings[shotIndex]?.img === img) syncShotHud(meetings[shotIndex]);
            });
          }
          meetings.push({
            el,
            video,
            img,
            kind: a.kind || "video",
            trail: a.trail || "front",
            lockTempoAfter: !!a.lockTempoAfter,
            subEnd: !!a.subEnd,
            stillDur: SHOT_STILL_DUR,
            stillT: 0,
            sub: el.querySelector(".sub"),
            progress: a.progress,
            startMs: a.startMs,
            ele: a.ele,
            hr: a.hr,
          });
        });

        statusEl.hidden = true;
        resize();
        readScroll();

        addEventListener("scroll", readScroll, { passive: true });
        addEventListener("resize", resize, { passive: true });

        // playlist-driven — block page scroll chrome
        addEventListener("wheel", (e) => {
          e.preventDefault();
        }, { passive: false });

        // click anywhere to pause / resume the live experience
        addEventListener("click", () => {
          if (!isLive || performance.now() < pauseArmedAt) return;
          toggleExperiencePause();
        });

        requestAnimationFrame(tick);
      } catch (err) {
        console.error(err);
        statusEl.classList.add("error");
        statusEl.hidden = false;
        statusEl.textContent = err.message + " — open via http://127.0.0.1:8765/";
      }
    }

    main();
  </script>
</body>
</html>
